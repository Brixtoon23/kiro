[project]
name = "corpus-ingesta"
version = "0.1.0"
description = "Deterministic legal-corpus ingestion pipeline for a Colombian-law RAG system (ingestion phase only, no LLM at runtime)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pdfminer.six>=20231228",
    "playwright>=1.63.0",
    "python-docx>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "black>=24.0",
    "mypy>=1.8",
]

[project.scripts]
corpus-fase-a = "corpus_ingesta.phase_a:main"
corpus-fase-b = "corpus_ingesta.phase_b:main"
corpus-fase-c = "corpus_ingesta.phase_c:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/corpus_ingesta"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
